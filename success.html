<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Message sent — MONTRA WEB DESIGN</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#080808">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23080808'/%3E%3Cpath d='M12 48V16h6l14 20 14-20h6v32h-6V27L32 46 18 27v21z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--muted:#a0a0a0;--line:#292929;--ease:cubic-bezier(.22,.8,.24,1);--gut:clamp(20px,4vw,56px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:#fff;font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
::selection{background:#fff;color:#080808}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:4px}
header{padding:0 var(--gut);height:76px;display:flex;align-items:center}
.logo{display:flex;flex-direction:column;line-height:1;gap:6px}
.logo b{font-size:1.35rem;font-weight:800;letter-spacing:.18em}
.logo small{font-size:.54rem;letter-spacing:.42em;color:var(--muted);font-weight:500}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:60px var(--gut)}
.label{font-size:.72rem;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:14px}
.label::before{content:"";width:32px;height:1px;background:var(--muted)}
h1{font-size:clamp(2.4rem,8vw,7rem);font-weight:700;text-transform:uppercase;letter-spacing:-.045em;line-height:.95;margin:24px 0 30px}
p{color:var(--muted);max-width:30em;margin-bottom:36px}
.btn{display:inline-flex;align-items:center;gap:12px;padding:16px 28px;border-radius:999px;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border:1px solid #fff;background:#fff;color:#080808;transition:color .4s var(--ease),background .4s var(--ease)}
.btn:hover{background:transparent;color:#fff}
footer{border-top:1px solid var(--line);padding:24px var(--gut);font-size:.78rem;color:var(--muted)}
</style>
</head>
<body>
<header><a href="/" class="logo" aria-label="MONTRA Web Design — home"><b>MONTRA</b><small>WEB DESIGN</small></a></header>
<main>
  <div><span class="label">Message sent</span></div>
  <h1>Thank you.</h1>
  <p>Your message has been sent. We'll read it carefully and be in touch soon.</p>
  <div><a class="btn" href="/">Back to home</a></div>
</main>
<footer>© MONTRA WEB DESIGN. All rights reserved.</footer>
</body>
</html>
